<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Galería</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* EFECTO PANTALLA COMPLETA (LIGHTBOX) */
    .lightbox {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox.activo { opacity: 1; pointer-events: auto; }
    
    .lightbox img {
      max-width: 90%; max-height: 90%;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: scale(0.8);
      transition: transform 0.3s ease;
    }
    .lightbox.activo img { transform: scale(1); }
    
    .btn-cerrar {
      position: absolute; top: 20px; right: 20px;
      color: white; font-size: 2.5rem; cursor: pointer;
      background: none; border: none; font-weight: 200;
    }
    
    /* BOTÓN PARA SILENCIAR MÚSICA */
    .btn-mutear {
      position: fixed;
      bottom: 20px; 
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 12px 15px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      transition: 0.3s;
      z-index: 10;
    }
    .btn-mutear:hover { background: rgba(255, 255, 255, 0.4); }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Nunito', sans-serif;
      background-image: url('imgGaleria/fondo.jpeg'); 
      background-size: cover;
      background-position: center;
      /* background-attachment: fixed; <-- ELIMINADO PARA QUITAR EL LAG */
      display: flex; 
      flex-direction: column;
      align-items: center; 
      min-height: 100vh;
      color: #fff;
      opacity: 0; 
      transition: opacity 0.6s ease-in-out;
      padding: 60px 20px 40px 20px;
    }
    
    .overlay {
      background: rgba(0, 0, 0, 0.5);
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    }

    /* BOTÓN FLOTANTE PARA REGRESAR */
    .btn-flotante {
      position: fixed;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      z-index: 10;
      top: 20px; left: 20px;
    }
    .btn-flotante:hover { background: rgba(255, 255, 255, 0.4); }

    /* CONTENEDOR DE LA GALERÍA ESTILO CRISTAL */
    .galeria-contenedor {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px); /* <-- REDUCIDO DE 12 A 5 PARA QUITAR EL LAG */
      padding: 30px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: 100%;
      max-width: 600px;
      text-align: center;
      margin-bottom: 30px;
    }

    h1 { margin-bottom: 25px; font-size: 2rem; text-shadow: 1px 1px 5px rgba(0,0,0,0.3); }

    /* CUADRÍCULA DE FOTOS */
    .grid-fotos {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 15px;
      margin-bottom: 30px;
    }

    .grid-fotos img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s;
      will-change: transform; /* <-- AGREGADO PARA FORZAR ACELERACIÓN GRÁFICA */
    }
    
    .grid-fotos img:hover {
      transform: scale(1.05);
    }

    /* BOTÓN DE VIDEOS HASTA ABAJO */
    .btn-videos {
      display: inline-block;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      text-decoration: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .btn-videos:hover { background: #fff; transform: scale(1.05); }

  </style>
</head>
<body>
  <audio id="musicaFondo" loop autoplay>
    <source src="imgGaleria/audgal.mp3" type="audio/mpeg">
  </audio>
  <button class="btn-mutear" id="btn-mutear">🔊</button>
  
  <div class="overlay"></div>

  <!-- Botón para regresar al menú principal -->
  <a href="index.html" class="btn-flotante" id="btn-regresar">← Volver</a>

  <div class="galeria-contenedor">
    <h1>Nuestros Momentos</h1>
    
    <div class="grid-fotos">
      <img src="imgGaleria/foto1.jpg" alt="Recuerdo 1" loading="lazy">
      <img src="imgGaleria/foto2.jpg" alt="Recuerdo 2" loading="lazy">
      <img src="imgGaleria/foto3.jpg" alt="Recuerdo 3" loading="lazy">
      <img src="imgGaleria/foto4.jpg" alt="Recuerdo 4" loading="lazy">
      <img src="imgGaleria/foto5.jpg" alt="Recuerdo 5" loading="lazy">
      <img src="imgGaleria/foto6.jpg" alt="Recuerdo 6" loading="lazy">
      <img src="imgGaleria/foto7.jpg" alt="Recuerdo 7" loading="lazy">
      <img src="imgGaleria/foto8.jpg" alt="Recuerdo 8" loading="lazy">
      <img src="imgGaleria/foto9.jpg" alt="Recuerdo 9" loading="lazy">
      <img src="imgGaleria/foto10.jpg" alt="Recuerdo 10" loading="lazy">
      <img src="imgGaleria/foto11.jpg" alt="Recuerdo 11" loading="lazy">
      <img src="imgGaleria/foto12.jpg" alt="Recuerdo 12" loading="lazy">
      <img src="imgGaleria/foto13.jpg" alt="Recuerdo 13" loading="lazy">
      <img src="imgGaleria/foto14.jpg" alt="Recuerdo 14" loading="lazy">
      <img src="imgGaleria/foto15.jpg" alt="Recuerdo 15" loading="lazy">
      <img src="imgGaleria/foto16.jpg" alt="Recuerdo 16" loading="lazy">
      <img src="imgGaleria/foto17.jpg" alt="Recuerdo 17" loading="lazy">
      <img src="imgGaleria/foto18.jpg" alt="Recuerdo 18" loading="lazy">
      <img src="imgGaleria/foto19.jpg" alt="Recuerdo 19" loading="lazy">
      <img src="imgGaleria/foto20.jpg" alt="Recuerdo 20" loading="lazy">
      <img src="imgGaleria/foto21.jpg" alt="Recuerdo 21" loading="lazy">
      <img src="imgGaleria/foto22.jpg" alt="Recuerdo 22" loading="lazy">
      <img src="imgGaleria/foto23.jpg" alt="Recuerdo 23" loading="lazy">
      <img src="imgGaleria/foto24.jpg" alt="Recuerdo 24" loading="lazy">
      <img src="imgGaleria/foto25.jpg" alt="Recuerdo 25" loading="lazy">
      <img src="imgGaleria/foto26.jpg" alt="Recuerdo 26" loading="lazy">
      <img src="imgGaleria/foto27.jpg" alt="Recuerdo 27" loading="lazy">
      <img src="imgGaleria/foto28.jpg" alt="Recuerdo 28" loading="lazy">
      <img src="imgGaleria/foto29.jpg" alt="Recuerdo 29" loading="lazy">
      <img src="imgGaleria/foto30.jpg" alt="Recuerdo 30" loading="lazy">
    </div>

    <!-- Botón que llevará a la página de videos -->
    <a href="videos.html" class="btn-videos" id="btn-videos">Ver Videos 🎬</a>
  </div>

  <!-- CONTENEDOR QUE SE ABRE AL TOCAR LA FOTO -->
  <div class="lightbox" id="miLightbox">
    <button class="btn-cerrar" id="btnCerrarLightbox">×</button>
    <img src="" alt="Foto expandida" id="imgLightbox">
  </div>
  
  <script>
    const musicaFondo = document.getElementById('musicaFondo');
    const btnMutear = document.getElementById('btn-mutear');
    
    btnMutear.addEventListener('click', () => {
      if (musicaFondo.muted) {
        musicaFondo.muted = false;
        btnMutear.textContent = '🔊';
      } else {
        musicaFondo.muted = true;
        btnMutear.textContent = '🔇';
      }
    });
    
    const btnRegresar = document.getElementById('btn-regresar');
    const btnVideos = document.getElementById('btn-videos');

    // Efecto de aparición suave
    window.onload = () => {
      document.body.style.opacity = '1';
    };

    // Efecto de desvanecimiento al salir
    function transicionSalida(event, url) {
      event.preventDefault();
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = url;
      }, 500);
    }

    btnRegresar.addEventListener('click', (e) => transicionSalida(e, btnRegresar.href));
    btnVideos.addEventListener('click', (e) => transicionSalida(e, btnVideos.href));
    
    const lightbox = document.getElementById('miLightbox');
    const imgLightbox = document.getElementById('imgLightbox');
    const btnCerrarLightbox = document.getElementById('btnCerrarLightbox');
    const todasLasFotos = document.querySelectorAll('.grid-fotos img');

    // Al tocar una foto, copia su enlace y abre la pantalla completa
    todasLasFotos.forEach(foto => {
      foto.style.cursor = 'pointer'; 
      foto.addEventListener('click', () => {
        imgLightbox.src = foto.src;
        lightbox.classList.add('activo');
      });
    });

    // Cierra la foto al tocar la "X" o el fondo negro
    btnCerrarLightbox.addEventListener('click', () => lightbox.classList.remove('activo'));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) lightbox.classList.remove('activo');
    });
  </script>
</body>
</html>
