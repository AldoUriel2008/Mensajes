<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* El body empieza invisible (opacity: 0) para hacer el efecto de desvanecimiento */
    body {
      font-family: 'Nunito', sans-serif;
      background-image: url('imagenes/fondo_audio4.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      color: #333;
      opacity: 0; 
      transition: opacity 0.6s ease-in-out;
      overflow: hidden; /* Evita barras de scroll raras */
    }
    
    .overlay {
      background: rgba(0, 0, 0, 0.5);
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    }

    /* BOTONES FLOTANTES */
    .btn-flotante {
      position: absolute;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: rgb(26, 16, 4);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      z-index: 10;
    }
    .btn-flotante:hover { background: rgba(255, 255, 255, 0.4); }
    
    .btn-regresar { top: 25px; left: 25px; }
    .btn-silenciar { bottom: 25px; right: 25px; }

    /* TARJETA CENTRAL */
    .card {
      background: rgba(255, 255, 255, 0.548);
      max-width: 380px; width: 90%;
      border-radius: 20px; padding: 25px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
      z-index: 1;
    }
    .photo {
      width: 100%; height: 260px; object-fit: cover;
      border-radius: 14px; margin-bottom: 20px;
    }
    h2 { margin-bottom: 20px; color: #4a4a4a; font-size: 1.6rem; }
    .player-label { font-size: 0.95rem; color: #4a4a4a; margin-bottom: 10px; font-weight: 600;}
    
     audio { 
      width: 80%; /* Lo hace más corto para que no pegue con las orillas */
      height: 45px; /* Lo hace un poco más delgado */
      margin: 0 auto 20px auto; /* Lo centra perfectamente en la tarjeta */
      display: block;
      outline: none;
      border-radius: 30px; /* Asegura que las esquinas sean bien redonditas */
      box-shadow: 0 5px 15px rgba(0,0,0,0.08); /* Le da una sombra muy sutil y elegante */
        filter: sepia(0.3) hue-rotate(-20deg);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- Botón Arriba a la Izquierda -->
  <a href="index.html" class="btn-flotante btn-regresar" id="btn-regresar">← Volver</a>

  <!-- Botón Abajo a la Derecha -->
  <button class="btn-flotante btn-silenciar" id="btn-silenciar">🔊 Música ON</button>

  <div class="card">
    <img src="imagenes/foto_audio4.jpeg
    " alt="Para ti" class="photo">
    <h2>Mensaje 3</h2>
    
    <!-- Música de fondo oculta -->
    <audio id="musica" loop>
      <source src="audios/Como_Respirar4.mp3" type="audio/mpeg">
    </audio>

    <!-- Reproductor de voz visible -->
    <div class="player-label">🎙️ Toca play para escuchar</div>
    <audio controls id="voz">
      <source src="audios/voz4.mp4" type="audio/mp4">
    </audio>
  </div>

  <script>
    
    const musica = document.getElementById('musica');
    const voz = document.getElementById('voz');
    const btnSilenciar = document.getElementById('btn-silenciar');
    const btnRegresar = document.getElementById('btn-regresar');

    let intervaloFade;
    const volumenMaximo = 0.05; // Tu volumen ideal

    // 1. Efecto de aparición al cargar la página
    window.onload = () => {
      document.body.style.opacity = '1';
      musica.volume = 0; // Preparamos la música en silencio
    };

    // 2. PLAY: Arranca la música y sube el volumen suavemente (Fade In)
    voz.addEventListener('play', () => { 
      clearInterval(intervaloFade);
      if(!musica.muted) {
          musica.play();
          intervaloFade = setInterval(() => {
            if (musica.volume < volumenMaximo) {
              musica.volume = Math.min(volumenMaximo, musica.volume + 0.02); // Sube gradual
            } else {
              clearInterval(intervaloFade);
            }
          }, 50); // Velocidad del desvanecimiento
      } else {
          musica.play(); // Si ella mutó la canción, respeta su decisión
      }
    });

    // 3. PAUSE: Baja el volumen suavemente y luego pausa (Fade Out)
    voz.addEventListener('pause', () => { 
      clearInterval(intervaloFade);
      if(!musica.muted) {
          intervaloFade = setInterval(() => {
            if (musica.volume > 0.02) {
              musica.volume -= 0.02; // Baja gradual
            } else {
              musica.volume = 0;
              musica.pause();
              clearInterval(intervaloFade);
            }
          }, 50);
      } else {
          musica.pause();
      }
    });

    // 4. Botón para silenciar (Mute)
    btnSilenciar.addEventListener('click', () => {
      if (musica.muted) {
        musica.muted = false;
        musica.volume = volumenMaximo;
        btnSilenciar.innerHTML = '🔊 Música ON';
      } else {
        musica.muted = true;
        btnSilenciar.innerHTML = '🔇 Música OFF';
      }
    });

    // 5. Efecto de desvanecimiento al presionar "Volver"
    btnRegresar.addEventListener('click', (e) => {
      e.preventDefault(); 
      document.body.style.opacity = '0'; 
      setTimeout(() => {
        window.location.href = btnRegresar.href; 
      }, 500);
    });
  </script>
</body>
</html>
