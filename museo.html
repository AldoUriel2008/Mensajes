<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Arte</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Nunito', sans-serif;
      background-image: url('imgMuseo/fondo.jpeg'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      padding: 20px;
      opacity: 0; 
      transition: opacity 0.5s ease-in-out;
    }
    
    .overlay {
      background: rgba(0, 0, 0, 0.7);
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    }

    .btn-flotante {
      position: fixed;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: 600;
      top: 20px; left: 20px;
      z-index: 10;
    }

    h1 {
      position: absolute;
      top: 80px;
      font-size: 2rem;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      text-align: center;
      letter-spacing: 1px;
    }
    
    /* CONTENEDOR DEL CARRUSEL Y FLECHAS */
    .carrusel-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 450px;
      margin-top: 60px;
    }

    .flecha {
      position: absolute;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: 0.3s;
    }

    .flecha:hover { background: rgba(0, 0, 0, 0.8); transform: scale(1.1); }
    .flecha-izq { left: -15px; }
    .flecha-der { right: -15px; }

  
    .cuadro-marco {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      text-align: center;
      width: auto;           /* Se ajusta al ancho de la pintura */
      max-width: 100%;
      display: inline-block; /* Hace que el contenedor envuelva a la foto */
      transition: opacity 0.4s ease-in-out;
    }

    /* EL PASPARTÚ (BORDE BLANCO) */
    .cuadro-marco img {
      max-width: 100%;
      max-height: 55vh;      /* Evita que obras verticales se salgan de la pantalla */
      width: auto;
      height: auto;          /* Mantiene la proporción original impecable */
      border: 12px solid #fdfdfd;
      border-bottom-width: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.8);
      margin-bottom: 20px;
      border-radius: 2px;
    }

    /* EL PASPARTÚ (BORDE BLANCO TIPO MUSEO) */
    .cuadro-marco img {
      width: 100%;
      max-height: 50vh;
      object-fit: cover;
      border: 12px solid #fdfdfd;
      border-bottom-width: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.8);
      margin-bottom: 20px;
      border-radius: 2px;
    }

    .ficha-tecnica {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #eee;
    }

    .titulo-obra {
      font-weight: 700;
      font-size: 1.3rem;
      color: #fff;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tecnica {
      font-style: italic;
      color: #ccc;
      font-size: 0.9rem;
    }
    
    /* INDICADOR DE FOTOS (1/3, 2/3...) */
    .indicador {
      margin-top: 20px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
      letter-spacing: 2px;
    }
    .btn-mutear {
        position: fixed; bottom: 20px; right: 20px;
        background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px);
        color: white; border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 12px 15px; border-radius: 50%; font-size: 1.5rem;
        cursor: pointer; transition: 0.3s; z-index: 10;
    }
    .btn-mutear:hover { background: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body>
    <audio id="musicaFondo" loop autoplay>
  <source src="imgMuseo/audmuseo.mp3" type="audio/mpeg">
</audio>
<button class="btn-mutear" id="btn-mutear">🔊</button>
  <div class="overlay"></div>
  <a href="index.html" class="btn-flotante">← Volver</a>
  
  <h1>Galería artística </h1>
  <div class="carrusel-wrapper">
    <button class="flecha flecha-izq" id="btnIzq">❮</button>
    
    <div class="cuadro-marco" id="marcoObra">
      <img id="imagenObra" src="" alt="Obra de Arte">
      <div class="ficha-tecnica">
        <div class="titulo-obra" id="tituloObra">Cargando...</div>
        <div class="tecnica" id="tecnicaObra"></div>
      </div>
    </div>
    
    <button class="flecha flecha-der" id="btnDer">❯</button>
  </div>

  <div class="indicador" id="indicadorTexto">1 / 3</div>

  <script>
    const galeriaMuseo = [
      {
        imagen: 'imgMuseo/artegrande.jpg',
        titulo: 'Una gran obra con una tarjeta en medio',
      },
      {
        imagen: 'imgMuseo/artesolo.jpg',
        titulo: 'Foto tomada en una de las galerias que visitamos cuando nos cancelamos clases',
      },
       {
        imagen: 'imgMuseo/bellasartes.jpg',
        titulo: 'Que lindos recuerdos tengo de la explanada de bellas artes :)',
      },
       {
        imagen: 'imgMuseo/cartadeamor.jpg',
        titulo: 'Me encanta la flor de esa carta. es muy estética y linda',
      },
       {
        imagen: 'imgMuseo/corazonchapu.jpg',
        titulo: '¿Seguirán ahí nuestros pulgares?',
      },
       {
        imagen: 'imgMuseo/fotodepiojosocontiburon.jpg',
        titulo: 'Un gran día y una gran exposición, vamos de nuevo, si?',
      },
       {
        imagen: 'imgMuseo/guapotaenplata.jpg',
        titulo: 'Que divina e increible te ves en esa foto bombón (ñam)',
      },
       {
        imagen: 'imgMuseo/manitaschapu.jpg',
        titulo: 'Hay que hacer unas playeras con los mismos colores, ándale',
      },
       {
        imagen: 'imgMuseo/piojosodeespaldas.jpg',
        titulo: 'Que lejotes me veo',
      },
       {
        imagen: 'imgMuseo/piojosodelejos.jpg',
        titulo: 'Pero dile que voltee',
      },
       {
        imagen: 'imgMuseo/piojososmupe.jpg',
        titulo: 'MIRAAAAAA, que gran foto, no?',
      },
       {
        imagen: 'imgMuseo/piojososoumaya.jpg',
        titulo: 'Vamos de nuevo?',
      },
       {
        imagen: 'imgMuseo/piojosospapalote.jpg',
        titulo: '¿Su jabón ya hará burbujas o nadotota?',
      },
        {
        imagen: 'imgMuseo/piojosostole.jpg',
        titulo: 'De las pocas veces que hemos hecho tarea juntos, Je',
      },
        {
        imagen: 'imgMuseo/selloescencia.jpg',
        titulo: 'Me encantó tu sello, el mío también pero el tuyo más',
      },
        {
        imagen: 'imgMuseo/victorianaroja.jpg',
        titulo: 'Las victorianas son las cartas que mas me encanta leer y recibir, tus dibujos y las palabras siempre me hacen sentir bien',
      },
      {
        imagen: 'imgMuseo/caballitodemar.jpg',
        titulo: 'En una de nuestras vidas, fuimos dos ejemplares',
      }
    ];

    let indiceActual = 0;
    
    const marcoObra = document.getElementById('marcoObra');
    const imagenObra = document.getElementById('imagenObra');
    const tituloObra = document.getElementById('tituloObra');
    const tecnicaObra = document.getElementById('tecnicaObra');
    const indicadorTexto = document.getElementById('indicadorTexto');

    // Función para actualizar la información del cuadro en pantalla
    function actualizarCuadro() {
      
      marcoObra.style.opacity = '0';
      
      setTimeout(() => {
        const obraActual = galeriaMuseo[indiceActual];
        imagenObra.src = obraActual.imagen;
        tituloObra.textContent = obraActual.titulo;
        tecnicaObra.textContent = obraActual.tecnica;
        indicadorTexto.textContent = `${indiceActual + 1} / ${galeriaMuseo.length}`;
        
        // Aparece la nueva obra
        marcoObra.style.opacity = '1';
      }, 300); // 300ms de transición
    }

    // Botón Derecha (Siguiente)
    document.getElementById('btnDer').addEventListener('click', () => {
      indiceActual++;
      if (indiceActual >= galeriaMuseo.length) {
        indiceActual = 0; // Regresa al principio si llega al final
      }
      actualizarCuadro();
    });

    // Botón Izquierda (Anterior)
    document.getElementById('btnIzq').addEventListener('click', () => {
      indiceActual--;
      if (indiceActual < 0) {
        indiceActual = galeriaMuseo.length - 1; // Va a la última si retrocede desde la primera
      }
      actualizarCuadro();
    });

    // Cargar la primera obra al iniciar la página
    window.onload = actualizarCuadro;
    // Efecto de aparición suave al entrar
    window.onload = () => {
      document.body.style.opacity = '1';
    };

    // Efecto de desvanecimiento al tocar el botón de Volver
    const btnRegresar = document.querySelector('.btn-flotante');
    if (btnRegresar) {
      btnRegresar.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.style.opacity = '0';
        setTimeout(() => {
          window.location.href = btnRegresar.href;
        }, 500);
      });
    }
    const musicaFondo = document.getElementById('musicaFondo');
    musicaFondo.volume = 0.25;

    const btnMutear = document.getElementById('btn-mutear');
    if (btnMutear) {
    btnMutear.addEventListener('click', () => {
        musicaFondo.muted = !musicaFondo.muted;
        btnMutear.textContent = musicaFondo.muted ? '🔇' : '🔊';
  });
}
  </script>
</body>
</html>
